<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese TV Study Project</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="max-w-4xl mx-auto">

    <div class="flex justify-between items-center mb-8">
        <h1>쉐도잉 연습</h1>
        <button>🏠 홈</button>
    </div>

</div>

<div class="container">

    <div class="quiz-container">

        <div id="question">
            문제를 불러오는 중입니다...
        </div>

        <button id="answerBtn">
            정답 보기
        </button>

        <div id="answer">

            <div id="jpContainer">

                <div id="jpText"></div>

                <button id="audioBtn">
                    🔊
                </button>

            </div>

        </div>

        <button id="nextBtn">
            다음 문제
        </button>

    </div>

</div>

<script src="script.js"></script>

</html>
