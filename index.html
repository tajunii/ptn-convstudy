<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese TV Study Project</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #080710;
            color: white;
            font-family: 'Outfit', 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        header {
            position: relative;
            margin-top: 40px;
            display: flex;
            width: 100%;
            align-items: center;
            gap: 15px;
            justify-content: flex-end;
            padding-right: 40px;
        }

        h1 {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 50px;
            color: #D8C8FF;
            opacity: 0.8;
        }

        /* 주차 선택 드롭다운 스타일 */
        #weekSelect {
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 12px;
            background-color: #131224;
            color: #cbd5e1;
            border: 2px solid #475569;
            cursor: pointer;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        #weekSelect:focus, #weekSelect:hover {
            border-color: #fbbf24;
            color: white;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .quiz-container {
            width: 1000px;
            max-width: 90vw;
            background: #131224;
            padding: 60px;
            border-radius: 36px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #question {
            font-size: 44px;
            color: #fbbf24;
            font-weight: 800;
            line-height: 1.5;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
        }

        #answer {
            display: none;
            margin-top: 40px;
            animation: fadeIn 0.3s ease-in-out;
        }

        #answer.reveal {
            display: block;
        }

        #jpText {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.5;
            color: #ffffff;
        }

        button {
            margin-top: 30px;
            font-size: 28px;
            font-weight: 700;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #ffffff;
            color: #131224;
            transition: all 0.2s ease;
        }

        button:focus, button:hover {
            outline: 6px solid #fbbf24;
            outline-offset: 4px;
            background-color: #e2e8f0;
            transform: scale(1.05);
        }

        /* 평가 버튼 컨테이너 (쉬움/어려움) */
        #evaluationBtns {
            display: none;
            /* 버튼 사이 간격을 대폭 확대 (오클릭 방지) */
            gap: 100px; 
            justify-content: center;
            margin-top: 30px;
        }

        #evaluationBtns button {
            margin-top: 0;
            font-size: 18px; 
            padding: 15px 30px; 
        }

        /* 쉬움 버튼 (파란색 계열) */
        #easyBtn {
            background-color: #3b82f6;
            color: white;
        }

        #easyBtn:focus, #easyBtn:hover {
            outline-color: #93c5fd;
            background-color: #2563eb;
        }

        /* 어려움 버튼 (주황/빨간색 계열) */
        #hardBtn {
            background-color: #f97316;
            color: white;
        }

        #hardBtn:focus, #hardBtn:hover {
            outline-color: #fdba74;
            background-color: #ea580c;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #jpContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        #audioBtn {
            margin-top: 0;
            padding: 0;
            border: none;
            background: transparent;
            color: #fbbf24;
            font-size: 34px;
            cursor: pointer;
        }

        #audioBtn:hover,
        #audioBtn:focus {
            background: transparent;
            outline: none;
            transform: scale(1.15);
        }

        #homeBtn {
            margin-top: 0;
            padding: 10px;
            font-size: 28px;
            background: transparent;    
            color: #ffffff;
        }

        #homeBtn:focus, #homeBtn:hover {
            background-color: transparent;
            outline: none;
            transform: scale(1.15);
        }

        /* 진행 상태 영역 개선 */
        #progress {
            margin-bottom: 25px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            gap: 30px; /* 완료율과 학습횟수 사이 간격 */
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-flex;
        }

        /* 마스터 완료율 색상 */
        .mastery {
            color: #86efac;
            font-weight: 600;
        }

        /* 총 학습 횟수 색상 */
        .count {
            color: #93c5fd;
            font-weight: 600;
        }

        #resetBtn {
            margin-top: 10px;
            font-size: 15px;
            padding: 12px 24px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
        }

        #resetBtn:hover,
        #resetBtn:focus {
            background: #334155;
            color: white;
            outline: none;
        }

        .bottom-menu {
            display: flex;
            justify-content: flex-end;
            margin-top: 40px;
            gap: 10px;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<header class="header">
    <h1>문형 익히기</h1>
    
    <!-- 주차 선택 드롭다운 -->
    <select id="weekSelect">
        <option value="all">전체 데이터</option>
    </select>

    <button id="homeBtn">🏠</button>
</header>

<div class="container">
    <div class="quiz-container">
        <!-- 개선된 진행 상태 표시 영역 -->
        <div id="progress"></div>
        
        <div id="question">
            문제를 불러오는 중입니다...
        </div>

        <button id="answerBtn">
            정답 보기
        </button>

        <div id="answer">
            <div id="jpContainer">
                <div id="jpText"></div>
                <button id="audioBtn">🔊</button>
            </div>
        </div>

        <!-- 쉬움/어려움 평가 버튼 영역 -->
        <div id="evaluationBtns">
            <button id="easyBtn">쉬움 (외움)</button>
            <button id="hardBtn">어려움 (다시)</button>
        </div>

        <div class="bottom-menu">
            <button id="resetBtn">처음부터 다시 시작</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTUWrzsscnZ3sHRvSenqLY4o1c-mkvZLYV9GDTdhjvwkyBI7AYjkIRGFKX3Qjdftb7NL5m6HGnAYwS/pub?gid=1779898264&single=true&output=csv";

    let data = [];
    let remainingIndices = [];
    let current = null;
    let currentCategory = "all"; 
    let studyCount = 0; // 추가: 총 버튼 누른 횟수 기록

    // DOM 요소를 JS로 가져오기
    const questionEl = document.getElementById("question");
    const answerBtn = document.getElementById("answerBtn");
    const answerEl = document.getElementById("answer");
    const jpTextEl = document.getElementById("jpText");
    const progressEl = document.getElementById("progress");
    const resetBtn = document.getElementById("resetBtn");
    const audioBtn = document.getElementById("audioBtn");
    const weekSelect = document.getElementById("weekSelect");
    const evaluationBtns = document.getElementById("evaluationBtns");
    const easyBtn = document.getElementById("easyBtn");
    const hardBtn = document.getElementById("hardBtn");
    const STORAGE_KEY = "quizProgress";

    const audio = new Audio();

    // 오디오 재생 함수
    function playJapaneseAudio(filename) {
        if (!filename) return;
        const audioUrl = `https://raw.githubusercontent.com/tajunii/ptn-convstudy/main/audio/${filename}`;
        audio.src = audioUrl;
        audio.play().catch(error => {
            console.error("오디오 재생 실패:", error);
        });
    }

    // 배열 무작위 섞기 함수 (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 구글 시트 데이터 불러오기
    async function loadData() {
        try {
            const response = await fetch(SHEET_URL);
            const csv = await response.text();

            const result = Papa.parse(csv, {
                header: false,
                skipEmptyLines: true
            });

            const rows = result.data.slice(1); 

            data = rows.map(cols => ({
                week: cols[5]?.trim() || "", 
                jp: cols[6]?.trim() || "",
                kr: cols[7]?.trim() || "",
                audio: cols[8]?.trim() || ""
            })).filter(item => item.jp && item.kr);

            if (data.length > 0) {
                populateWeekSelect();
                
                if (!loadProgress()) {
                    resetRemainingIndices();
                } else {
                    weekSelect.value = currentCategory;
                }
                nextQuestion();
            } else {
                questionEl.textContent = "데이터를 찾을 수 없습니다.";
                answerBtn.style.display = "none";
            }
        } catch (error) {
            console.error(error);
            questionEl.textContent = "데이터를 불러오는데 실패했습니다.";
            answerBtn.style.display = "none";
        }
    }

    // 드롭다운 채우기
    function populateWeekSelect() {
        const weeks = [...new Set(data.map(item => item.week).filter(Boolean))].sort();
        weeks.forEach(w => {
            const option = document.createElement("option");
            option.value = w;
            option.textContent = w; 
            weekSelect.appendChild(option);
        });
    }

    // 항목 생성 및 카드 섞기 (초기화)
    function resetRemainingIndices() {
        remainingIndices = data
            .map((item, index) => ({ item, index }))
            .filter(obj => currentCategory === "all" || obj.item.week === currentCategory)
            .map(obj => obj.index);
        
        // 카드 덱을 섞습니다!
        shuffleArray(remainingIndices);
        studyCount = 0; // 학습 횟수 초기화
        
        saveProgress();
        updateProgress();
    }

    function saveProgress() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            remainingIndices: remainingIndices,
            category: currentCategory,
            studyCount: studyCount // 진행 상황 저장 시 학습 횟수도 함께 저장
        }));
    }

    // 진행률 UI 업데이트 (마스터율과 학습 횟수 분리)
    function updateProgress() {
        const totalInCategory = data.filter(item => currentCategory === "all" || item.week === currentCategory).length;
        const solved = totalInCategory - remainingIndices.length;
        
        progressEl.innerHTML = `
            <span class="mastery">✅ 마스터 : ${solved} / ${totalInCategory}</span>
            <span class="count">🔄 누적 학습 : ${studyCount}회</span>
        `;
    }

    function loadProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        
        const progress = JSON.parse(saved);
        if (progress.remainingIndices && progress.remainingIndices.length > 0) {
            remainingIndices = progress.remainingIndices;
            if (progress.category) {
                currentCategory = progress.category;
            }
            if (progress.studyCount !== undefined) {
                studyCount = progress.studyCount;
            }
            return true;
        }
        return false;
    }

    function nextQuestion() {
        // 남은 문제가 없으면 해당 차수 완료
        if (remainingIndices.length === 0) {
            alert(`🎉 축하합니다! 완벽하게 외웠습니다!\n총 ${studyCount}번의 문제 풀이를 진행했습니다.\n새롭게 다시 섞어서 시작합니다.`);
            localStorage.removeItem(STORAGE_KEY);
            resetRemainingIndices();
        }

        // 항상 카드 덱의 가장 위에 있는(첫 번째) 문제를 뽑습니다.
        const dataIndex = remainingIndices[0]; 
        
        current = data[dataIndex];
        
        if (!current) return;

        // UI 초기화
        questionEl.textContent = current.kr;
        answerEl.classList.remove("reveal");
        answerBtn.style.display = "inline-block";
        evaluationBtns.style.display = "none";
        answerBtn.focus();
    }

    // [정답 보기] 버튼 클릭 이벤트
    answerBtn.addEventListener("click", () => {
        if (!current) return;
        jpTextEl.textContent = current.jp;
        answerEl.classList.add("reveal");
        playJapaneseAudio(current.audio);
        
        answerBtn.style.display = "none";
        evaluationBtns.style.display = "flex"; 
        easyBtn.focus();
    });

    audioBtn.addEventListener("click", () => {
        if (!current) return;
        playJapaneseAudio(current.audio);
    });

    // [쉬움] 클릭: 완벽히 아는 문제이므로 덱에서 제거 후 다음 문제
    easyBtn.addEventListener("click", () => {
        remainingIndices.shift(); // 덱의 가장 첫 번째 카드 제거
        studyCount++; // 학습 횟수 증가
        saveProgress();
        updateProgress();
        nextQuestion();
    });

    // [어려움] 클릭: 덱의 가장 위에 있는 카드를 맨 뒤(바닥)로 보냄
    hardBtn.addEventListener("click", () => {
        const hardItem = remainingIndices.shift(); // 첫 번째 카드를 뽑아서
        remainingIndices.push(hardItem); // 덱의 가장 뒤에 집어넣음
        
        studyCount++; // 어려움을 눌러도 공부한 것이므로 횟수 증가
        saveProgress();
        updateProgress();
        nextQuestion();
    });

    // 주차(카테고리) 변경 시 이벤트
    weekSelect.addEventListener("change", (e) => {
        if (!confirm("항목을 변경하면 현재 진행 상황이 초기화됩니다. 변경하시겠습니까?")) {
            weekSelect.value = currentCategory;
            return;
        }
        currentCategory = e.target.value;
        localStorage.removeItem(STORAGE_KEY);
        resetRemainingIndices();
        nextQuestion();
    });

    // [처음부터 다시 시작] 클릭 이벤트
    resetBtn.addEventListener("click", () => {
        if (!confirm("처음부터 다시 시작하시겠습니까?")) return;
        localStorage.removeItem(STORAGE_KEY);
        resetRemainingIndices();
        nextQuestion();
    });

    // 앱 시작 시 데이터 로드
    loadData();

    // 홈 버튼 이벤트
    const homeBtn = document.getElementById("homeBtn");
    if (homeBtn) {
        homeBtn.addEventListener("click", () => {
            location.href = "https://tajunii.github.io/study-home/";
        });
    }
</script>
</body>
</html>
